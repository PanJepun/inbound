<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Inbound</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 h-screen flex flex-col">
<div class="bg-blue-600 text-white p-4 font-bold">💬 CHAT INBOUND - inbound2026-12ffe</div>
<div id="messages" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
<div class="p-4 bg-white flex gap-2"><input id="name" placeholder="Nama" class="border p-2 rounded w-24" value="Admin"><input id="msg" placeholder="Ketik pesan..." class="border p-2 rounded flex-1"><button onclick="send()" class="bg-blue-600 text-white px-4 rounded">Send</button></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDaF0kZroF4gCx8rFLTm88gF7-GS86fyg",
  authDomain: "inbound2026-12ffe.firebaseapp.com",
  projectId: "inbound2026-12ffe",
  storageBucket: "inbound2026-12ffe.firebasestorage.app",
  messagingSenderId: "368642042481",
  appId: "1:368642042481:web:0da95081f2039b357089d0",
  measurementId: "G-Q61303QL6F"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "chats");
const q = query(colRef, orderBy("created"));
window.send = async () => {
  const name = document.getElementById('name').value || 'Anon'; const text = document.getElementById('msg').value; if(!text) return;
  await addDoc(colRef, { name, text, created: new Date() }); document.getElementById('msg').value='';
};
document.getElementById('msg').addEventListener('keypress', e=>{ if(e.key==='Enter') send(); });
onSnapshot(q, (snap) => {
  const box = document.getElementById('messages'); box.innerHTML='';
  snap.forEach(d => { const v = d.data(); box.innerHTML += `<div class="bg-white p-2 rounded shadow"><b>${v.name}:</b> ${v.text}</div>`; });
  box.scrollTop = box.scrollHeight;
});
</script></body></html>
